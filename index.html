<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una web de mierda</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f5f0eb;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 60px 40px 48px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 3.8rem);
    font-weight: 700;
    color: #1a1410;
    letter-spacing: 0.02em;
  }

  .visit-counter {
    white-space: nowrap;
    font-size: 13px;
    color: #6b5f54;
    font-weight: 400;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .visit-counter span {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.5rem;
    color: #1a1410;
    display: block;
    line-height: 1;
    margin-bottom: 2px;
  }

  .gallery {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }

  .photo-card {
    overflow: hidden;
    cursor: pointer;
    border-radius: 3px;
  }

  .photo-card img {
    width: 100%;
    aspect-ratio: 375/500;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease, opacity 0.35s ease;
  }

  .photo-card:hover img {
    transform: scale(1.04);
    opacity: 0.92;
  }

  .photo-label {
    padding: 7px 4px 4px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .photo-label .num {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.85rem;
    color: #6b5f54;
  }

  .photo-label .date {
    font-size: 11px;
    color: #a09088;
    letter-spacing: 0.06em;
  }

  /* ── LIGHTBOX ── */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,20,16,0.93);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #lightbox.open {
    display: flex;
    animation: lbIn 0.2s ease;
  }

  @keyframes lbIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  #lightbox img {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 2px;
  }

  #lightbox .lb-close {
    position: fixed;
    top: 20px;
    right: 24px;
    background: none;
    border: none;
    color: #e8e0d8;
    font-size: 32px;
    cursor: pointer;
    line-height: 1;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  #lightbox .lb-close:hover { opacity: 1; }

  @media (max-width: 600px) {
    header { padding: 40px 20px 36px; }
    .gallery { padding: 0 12px 60px; gap: 8px; grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1>Una web de mierda</h1>
  <div class="visit-counter">
    <span id="visit-count">—</span>
    visitas
  </div>
</header>

<div class="gallery" id="gallery"></div>

<div id="lightbox" onclick="closeLightbox(event)">
  <button class="lb-close" onclick="closeLightbox()">×</button>
  <img id="lb-img" src="" alt="">
</div>

<script>
// ══════════════════════════════════════════════════
//  Las fotos se cargan desde photos.json, generado
//  automáticamente a partir del contenido real de
//  /fotos (ver scripts/generate-photos.mjs y el
//  workflow .github/workflows/update-photos.yml).
//  Ya no hace falta tocar este archivo para añadir
//  o quitar fotos: solo sube/borra imágenes en /fotos.
// ══════════════════════════════════════════════════

const gallery = document.getElementById('gallery');

function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-');
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function renderGallery(photos) {
  const sorted = [...photos].sort((a, b) => a.date.localeCompare(b.date));
  gallery.innerHTML = sorted.map((p, i) => `
  <div class="photo-card" onclick="openLightbox('${p.src}')">
    <img src="${p.src}" alt="" loading="lazy">
    <div class="photo-label">
      <span class="num">#${i + 1}</span>
      <span class="date">${formatDate(p.date)}</span>
    </div>
  </div>
`).join('');
}

fetch('photos.json')
  .then(r => r.json())
  .then(renderGallery)
  .catch(err => {
    console.error('No se pudo cargar photos.json', err);
    gallery.innerHTML = '<p style="padding:24px;color:#a09088;">No se pudieron cargar las fotos.</p>';
  });

function openLightbox(src) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(e) {
  if (e && e.target !== document.getElementById('lightbox') && !e.target.classList.contains('lb-close')) return;
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox({ target: document.getElementById('lightbox') });
});

// ── CONTADOR DE VISITAS ──────────────────────────
// Contador GoatCounter
fetch("https://jmmb78.goatcounter.com/counter/%2F.json")
  .then(r => r.json())
  .then(data => {
    document.getElementById('visit-count').textContent =
      data.count.toLocaleString('es');
  })
  .catch(() => {
    document.getElementById('visit-count').textContent = '—';
  });
</script>

<script data-goatcounter="https://jmmb78.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
